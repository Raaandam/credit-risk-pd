[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-pd"
version = "0.1.0"
description = "PD scorecard with XGBoost challenger, model validation and portfolio credit VaR on Lending Club data"
authors = [{ name = "Mayank Sharma" }]
license = { text = "MIT" }
requires-python = ">=3.10"

[project.scripts]
credit-risk-pd = "credit_risk_pd.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
